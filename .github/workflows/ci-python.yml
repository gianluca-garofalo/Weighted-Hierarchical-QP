name: ci-python

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'python/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci-python.yml'
      - '.github/actions/install-eigen/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'python/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci-python.yml'
      - '.github/actions/install-eigen/**'

jobs:
  test-python-bindings:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) has no Python 3.9
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # CMake and Ninja come with the runner image.
    - name: Install Eigen (Ubuntu)
      if: runner.os == 'Linux'
      uses: ./.github/actions/install-eigen

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja eigen

    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install ninja -y
        vcpkg install eigen3:x64-windows

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 numpy pytest

    - name: Configure CMake (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        cmake --preset python-release

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake --preset python-release -DCMAKE_PREFIX_PATH=$(brew --prefix)

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake --preset python-release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build Python bindings
      run: |
        cmake --build --preset python-release --config Release

    - name: Test Python bindings (Ubuntu/macOS)
      if: runner.os != 'Windows'
      run: |
        cd python
        PYTHONPATH=../build/python/Release python -m pytest test_pyhqp.py -v

    - name: Test Python bindings (Windows)
      if: runner.os == 'Windows'
      run: |
        cd python
        $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin;$env:PATH"
        $env:PYTHONPATH = "../build/python/Release"
        python -m pytest test_pyhqp.py -v

  test-setup-py:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.9', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Eigen
      uses: ./.github/actions/install-eigen

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pybind11 numpy setuptools wheel

    - name: Test setup.py build
      run: |
        cd python
        python setup.py build_ext --inplace
        python -c "import pyhqp; print('Import successful')"

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Lint with flake8
      run: |
        cd python
        flake8 --max-line-length=88 --extend-ignore=E203,W503 *.py

    - name: Check formatting with black
      run: |
        cd python
        black --check --diff *.py

    - name: Check import sorting with isort
      run: |
        cd python
        isort --check-only --diff *.py
