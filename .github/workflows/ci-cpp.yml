name: ci-cpp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test C++ (CMake)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [debug, release]
    steps:
      # Status badge (add to README):
      # ![C++ CI](https://github.com/${{ github.repository }}/actions/workflows/ci-cpp/badge.svg)

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CMake and Compiler Versions
        run: |
          cmake --version
          ${{ matrix.compiler }} --version

      # CMake, Ninja and Clang come with the runner image.
      - name: Install Eigen
        uses: ./.github/actions/install-eigen

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
            cmake-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          cmake --preset=${{ matrix.build_type }}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --preset ${{ matrix.build_type }}

      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --output-on-failure

      - name: Generate coverage report
        if: matrix.compiler == 'gcc' && matrix.build_type == 'debug'
        run: |
          pipx install gcovr
          gcovr --root . --html --html-details -o coverage.html
          echo "Coverage report generated: coverage.html"

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/
            !build/_deps/
          retention-days: 5

      - name: Upload coverage report
        if: matrix.compiler == 'gcc' && matrix.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30

  # The stack-of-tasks layer and the comparisons against DAQP and LexLS live in
  # their own repositories. Build their main branches against this HQP so a
  # change here that breaks them, or changes results against LexLS, shows up
  # on the pull request that causes it.
  downstream:
    name: Downstream (hqp-tasks, hqp-compare)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout HQP
        uses: actions/checkout@v4
        with:
          path: hqp

      - name: Checkout hqp-tasks
        uses: actions/checkout@v4
        with:
          repository: gianluca-garofalo/hqp-tasks
          path: hqp-tasks

      - name: Checkout hqp-compare
        uses: actions/checkout@v4
        with:
          repository: gianluca-garofalo/hqp-compare
          path: hqp-compare

      - name: Install Eigen
        uses: ./hqp/.github/actions/install-eigen

      - name: Install HQP
        run: |
          cmake -S hqp -B build/hqp -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --install build/hqp --prefix "$GITHUB_WORKSPACE/prefix"

      - name: Build, test and install hqp-tasks
        run: |
          cmake -S hqp-tasks -B build/hqp-tasks -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix"
          cmake --build build/hqp-tasks
          ctest --test-dir build/hqp-tasks --output-on-failure
          cmake --install build/hqp-tasks --prefix "$GITHUB_WORKSPACE/prefix"

      - name: Build and test hqp-compare
        run: |
          cmake -S hqp-compare -B build/hqp-compare -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix"
          cmake --build build/hqp-compare
          ctest --test-dir build/hqp-compare --output-on-failure
